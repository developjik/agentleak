name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-node${{ matrix.node }}
          path: test-results
          retention-days: 7

  gate:
    name: leak gate (fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Fixture leak gate
        run: |
          node --import tsx src/fixtures/serve.ts --port 4319 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4319/clean >/dev/null; then break; fi
            sleep 1
          done
          node dist/cli.js scan http://127.0.0.1:4319/clean --ua browser --out artifacts --fail-on-leak
          if node dist/cli.js scan http://127.0.0.1:4319/css-hidden --ua browser --out artifacts --format json --fail-on-leak; then
            echo "::error::the leak gate did not fail on the hidden-instruction fixture"
            exit 1
          fi
      - name: Upload fixture reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fixture-reports
          path: artifacts
          retention-days: 7
